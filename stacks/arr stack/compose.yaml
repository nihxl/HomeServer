services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    volumes:
      - <YOUR_DIRECTORY>Docker/Radarr/data:/config
      - /home/nihal/Server:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    volumes:
      - <YOUR_DIRECTORY>Docker/Sonarr/data:/config
      - /home/nihal/Server:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    volumes:
      - <YOUR_DIRECTORY>Docker/Prowlarr/data:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    ports:
      - "8686:8686"
    volumes:
      - <YOUR_DIRECTORY>Docker/Lidarr/data:/config
      - /home/nihal/Server:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    volumes:
      - <YOUR_DIRECTORY>Docker/Bazarr/data:/config
      - <YOUR_DIRECTORY>:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
