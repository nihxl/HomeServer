name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    volumes:
      - /opt/stacks/immich/upload:/data
      - /etc/localtime:/etc/localtime:ro
      
      - "<YOUR_DIRECTORY>:/mnt/localsend-saves:ro"
      - "<YOUR_DIRECTORY>:/mnt/External2"
    env_file:
      - .env
    environment:
      # Skip machine learning entirely — no face detection, CLIP search, or classification.
      IMMICH_MACHINE_LEARNING_ENABLED: "false"
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
      - immich-machine-learning
    restart: unless-stopped
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /opt/stacks/immich/database:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false
    labels:
      - com.centurylabs.watchtower.enable=false
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    volumes:
      - /opt/stacks/immich/model-cache:/cache
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      disable: false
